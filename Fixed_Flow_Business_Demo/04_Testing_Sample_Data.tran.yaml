        x: 0
        "y": 0
      tempMetlId: 1
    Join Customer Orders:
      position:
        x: 300
        "y": 75
      tempMetlId: 3
    Test Filters:
      position:
        x: 550
        "y": 75
      tempMetlId: 4
    Rewrite Table:
      position:
        x: 960
        "y": 75
      tempMetlId: 6
