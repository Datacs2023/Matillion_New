    Join Customer Orders:
      type: "join"
      sources:
      - "Test Order Data"
      - "Test Customer Data"
      parameters:
        componentName: "Join Customer Orders"
        mainTable: "Test Order Data"
        mainTableAlias: "o"
        joins:
        - - "Test Customer Data"
          - "c"
          - "Inner"
        joinExpressions:
        - - "\"o\".\"CUSTOMER_ID\"=\"c\".\"CUSTOMER_ID\""
          - "o_Inner_c"
        columnMappings:
        - - "o.ORDER_ID"
          - "ORDER_ID"
        - - "o.CUSTOMER_ID"
          - "CUSTOMER_ID"
        - - "o.ORDER_DATE"
          - "ORDER_DATE"
        - - "o.TOTAL_AMOUNT"
          - "TOTAL_AMOUNT"
        - - "o.STATUS"
          - "STATUS"
        - - "o.ITEMS_COUNT"
          - "ITEMS_COUNT"
        - - "c.CUSTOMER_ID"
          - "CUSTOMER_ID"
        - - "c.CUSTOMER_NAME"
          - "CUSTOMER_NAME"
        - - "c.EMAIL"
          - "EMAIL"
        - - "c.SEGMENT"
          - "SEGMENT"
        - - "c.ANNUAL_REVENUE"
          - "ANNUAL_REVENUE"
        - - "c.IS_ACTIVE"
          - "IS_ACTIVE"
        outputColumns:
        - - "o"
          - "ORDER_ID"
        - - "o"
          - "ORDER_DATE"
        - - "c"
          - "CUSTOMER_ID"
        - - "c"
          - "CUSTOMER_NAME"
        - - "c"
          - "SEGMENT"
        - - "c"
          - "IS_ACTIVE"
        - - "o"
          - "TOTAL_AMOUNT"
        - - "o"
          - "STATUS"
        - - "o"
          - "ITEMS_COUNT"
    Test Filters:
      type: "filter"
      sources:
      - "Join Customer Orders"
      parameters:
        componentName: "Test Filters"
        filterConditions:
        - - "TOTAL_AMOUNT"
          - "Is"
          - "Greater than or equal to"
          - "5000"
        - - "STATUS"
          - "Is"
          - "Equal to"
          - "Completed"
        combineCondition: "And"
    Test Aggregation:
      type: "aggregate"
      sources:
      - "Test Filters"
      parameters:
        componentName: "Test Aggregation"
        groupings:
        - "SEGMENT"
        aggregations:
        - - "TOTAL_AMOUNT"
          - "Sum"
        - - "ORDER_ID"
          - "Count"
        - - "TOTAL_AMOUNT"
          - "Average"
        groupingType: "Group By"
    Rewrite Table:
      type: "rewrite-table"
      sources:
      - "Test Aggregation"
      parameters:
        componentName: "Rewrite Table"
        warehouse: "[Environment Default]"
        database: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable: "TEST_RESULTS_BY_SEGMENT"
        orderBy:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
design:
  components:
    Test Order Data:
      position:
        x: 0
        "y": 150
      tempMetlId: 2
    Test Aggregation:
