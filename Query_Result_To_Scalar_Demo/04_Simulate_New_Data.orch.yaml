type: "orchestration"
version: "1.0"
pipeline:
  metadata:
    description: "Simulates new data arriving in source table - adds new transactions\
      \ for testing incremental load"
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Add New Transactions"
      parameters:
        componentName: "Start"
    Add New Transactions:
      type: "sql-executor"
      parameters:
        componentName: "Add New Transactions"
        scriptLocation: "Component"
        declareSqlVariables:
        variablesToInclude:
        fileName:
        sqlScript: |
          -- Simulate new transactions arriving
          INSERT INTO SOURCE_TRANSACTIONS (TRANSACTION_ID, CUSTOMER_ID, AMOUNT, TRANSACTION_DATE, STATUS)
          VALUES
            (41, 207, 225.00, '2024-01-04 10:30:00', 'Completed'),
            (52, 208, 350.75, '2024-01-05 13:45:00', 'Completed'),
            (63, 201, 175.50, '2024-01-06 16:20:00', 'Completed'),
            (74, 209, 425.00, '2024-01-07 09:00:00', 'Completed'),
            (85, 280, 290.25, '2024-01-08 11:30:00', 'Completed')
design:
  components:
    Start:
      position:
        x: 0
        "y": 0
      tempMetlId: 1
    Add New Transactions:
      position:
        x: 160
        "y": 0
      tempMetlId: 2
